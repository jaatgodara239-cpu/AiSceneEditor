<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16:9 Coded Animation Studio (Neural Voice + SFX)</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; background: #090b10; color: #f8fafc; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 720px; }
    .card { background: #121620; border: 1px solid #232938; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    h1 { font-size: 1.15rem; margin: 0 0 3px; }
    .sub { color: #94a3b8; font-size: 0.8rem; margin: 0 0 10px; }
    .stage-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #05070a; border-radius: 10px; overflow: hidden; border: 1px solid #2b3346; }
    canvas { width: 100%; height: 100%; display: block; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #cbd5e1; margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid #2a3142;
      background: #090b10; color: #f8fafc; font-size: 0.88rem;
    }
    textarea { min-height: 125px; resize: vertical; line-height: 1.45; }
    .btn {
      padding: 11px 10px; border: none; border-radius: 9px; font-weight: 700;
      font-size: 0.86rem; cursor: pointer; width: 100%;
    }
    .btn-primary { background: #f59e0b; color: #1c1002; }
    .btn-voice { background: #8b5cf6; color: #fff; }
    .btn-play { background: #22c55e; color: #052e16; }
    .btn-export { background: #3b82f6; color: #fff; }
    .btn-ghost { background: #1e2433; color: #e2e8f0; border: 1px solid #30394f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .scrubber { width: 100%; margin: 10px 0 2px; accent-color: #f59e0b; }
    .time-bar { display: flex; justify-content: space-between; font-size: 0.76rem; color: #94a3b8; }
    .scene-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .scene-item { background: #0b0e15; border: 1px solid #232a3b; border-radius: 9px; padding: 9px; }
    .scene-item.active { border-color: #f59e0b; }
    .scene-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.76rem; color: #f59e0b; font-weight: 700; }
    .scene-item select { padding: 5px 8px; font-size: 0.78rem; width: auto; }
    .scene-text { font-size: 0.82rem; color: #e2e8f0; line-height: 1.35; }
    .status { font-size: 0.8rem; color: #38bdf8; margin-top: 8px; font-weight: 600; }
    a.dl { display: block; text-align: center; margin-top: 10px; padding: 11px; background: #22c55e; color: #052e16; font-weight: 800; border-radius: 9px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>16:9 Coded Animation Studio</h1>
      <p class="sub">Free Neural Narration + Procedural SFX + Stick-Figure & Motion Graphics</p>

      <div class="stage-wrap">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>

      <input type="range" id="scrubber" class="scrubber" min="0" max="1000" value="0" oninput="seekScrubber(this.value)" />
      <div class="time-bar">
        <span id="curTime">00:00</span>
        <span id="sceneBadge">Scene 1 / 1</span>
        <span id="totTime">00:30</span>
      </div>

      <div class="controls">
        <button class="btn btn-play" id="playBtn" onclick="togglePlay()">Play Preview</button>
        <button class="btn btn-ghost" onclick="testSfx()">Test SFX</button>
        <button class="btn btn-export" id="exportBtn" onclick="exportVideo()">Export 16:9 Video</button>
      </div>
      <div class="status" id="statusMsg">Ready. Paste your script and tap "Generate Free Neural Voice".</div>
      <div id="downloadWrap"></div>
    </div>

    <div class="card">
      <div class="row2">
        <div>
          <label style="margin-top:0;">Video Topic / Title</label>
          <input id="topicInput" value="Why Your Brain Sabotages You At 3 AM" />
        </div>
        <div>
          <label style="margin-top:0;">Visual Theme</label>
          <select id="themeSelect" onchange="drawFrame(currentTime)">
            <option value="dark_ink">Dark Ink Stick-Figure</option>
            <option value="amber_blueprint">Amber Psychology Blueprint</option>
            <option value="survival_sketch">Minimalist Survival Sketch</option>
          </select>
        </div>
      </div>

      <label>Full Script (4–5 Min Script Supported)</label>
      <textarea id="scriptInput">At 3 AM, your brain stops acting like a rational planner and starts acting like a survival alarm. The prefrontal cortex, the part of your mind responsible for logic and impulse control, powers down to conserve energy. Meanwhile, your amygdala stays wide awake, scanning every quiet shadow for danger. That is why a tiny problem at midnight feels like an unstoppable crisis. When you are isolated from the crowd, your internal clock distorts time and multiplies stress. Step by step, overthinking traps you in a loop until morning light resets your nervous system.</textarea>

      <div class="row2">
        <div>
          <label>Neural Narrator Voice (Free)</label>
          <select id="voiceSelect">
            <option value="en-US-AndrewNeural">Andrew (Deep US Storytelling)</option>
            <option value="en-US-BrianNeural">Brian (Calm Documentary)</option>
            <option value="en-US-EmmaMultilingualNeural">Emma (Clear Explainer)</option>
            <option value="en-GB-RyanNeural">Ryan (British Narrator)</option>
            <option value="en-IN-PrabhatNeural">Prabhat (Indian English Male)</option>
            <option value="hi-IN-MadhurNeural">Madhur (Hindi Narrator)</option>
          </select>
        </div>
        <div>
          <label>Narration Speed</label>
          <select id="rateSelect">
            <option value="-10%">0.90x (Slow & Dramatic)</option>
            <option value="+0%" selected>1.00x (Natural Pacing)</option>
            <option value="+10%">1.10x (Fast Retention)</option>
          </select>
        </div>
      </div>

      <div class="row2" style="margin-top:10px;">
        <button class="btn btn-voice" id="genVoiceBtn" onclick="generateNeuralVoice()">Generate Free Neural Voice</button>
        <button class="btn btn-primary" onclick="rebuildStoryboard()">Sync Scenes Only</button>
      </div>

      <div class="row2" style="margin-top:8px;">
        <div>
          <label>Or Upload Custom Audio (MP3/WAV)</label>
          <input type="file" id="audioUpload" accept="audio/*" onchange="loadUploadedAudio(this.files[0])" />
        </div>
        <div>
          <label>Background Drone + SFX Level</label>
          <select id="sfxModeSelect">
            <option value="full" selected>SFX + Dark Ambient Drone</option>
            <option value="sfx_only">Transition SFX Only</option>
            <option value="off">Voice Only (No SFX)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:0.9rem;">Coded Animation Storyboard</strong>
        <span style="font-size:0.75rem; color:#94a3b8;">Tap any scene to preview or switch animation</span>
      </div>
      <div class="scene-list" id="sceneList"></div>
    </div>
  </div>

  <audio id="narrAudio" crossorigin="anonymous"></audio>
    <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const narrAudio = document.getElementById("narrAudio");

    const SCENE_TYPES = [
      { id: "stick_walk", label: "Stick-Figure Walk & Spotlight" },
      { id: "crowd_outlier", label: "Crowd vs. Outlier Stick Figures" },
      { id: "brain_network", label: "Neural Brain Network Pulse" },
      { id: "rising_chart", label: "Animated Growth / Stress Curve" },
      { id: "timeline_clock", label: "Animated Clock & Time Distortion" },
      { id: "split_compare", label: "Split Comparison Diagram" },
      { id: "heartbeat_meter", label: "Tension Heartbeat & Danger Meter" }
    ];

    const THEMES = {
      dark_ink: { bg: "#090b10", grid: "#151a26", ink: "#f8fafc", accent: "#f59e0b", sub: "#94a3b8" },
      amber_blueprint: { bg: "#0c0a07", grid: "#1f1910", ink: "#fef3c7", accent: "#fb923c", sub: "#d6c3a5" },
      survival_sketch: { bg: "#070d0c", grid: "#10201d", ink: "#ecfdf5", accent: "#34d399", sub: "#99c2b5" }
    };

    let scenes = [];
    let totalDuration = 28;
    let currentTime = 0;
    let isPlaying = false;
    let lastRaf = 0;
    let lastSceneIdx = -1;

    let audioCtx = null;
    let mediaNode = null;
    let destStreamNode = null;
    let droneOsc = null;
    let droneGain = null;

    function ensureAudioGraph() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destStreamNode = audioCtx.createMediaStreamDestination();
        mediaNode = audioCtx.createMediaElementSource(narrAudio);
        mediaNode.connect(audioCtx.destination);
        mediaNode.connect(destStreamNode);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function startDrone() {
      const mode = document.getElementById("sfxModeSelect").value;
      if (mode !== "full") return;
      ensureAudioGraph();
      if (droneOsc) return;
      droneOsc = audioCtx.createOscillator();
      droneGain = audioCtx.createGain();
      droneOsc.type = "sine";
      droneOsc.frequency.value = 58;
      droneGain.gain.value = 0.035;
      droneOsc.connect(droneGain);
      droneGain.connect(audioCtx.destination);
      droneGain.connect(destStreamNode);
      droneOsc.start();
    }

    function stopDrone() {
      if (droneOsc) {
        try { droneOsc.stop(); } catch {}
        droneOsc.disconnect();
        droneOsc = null;
      }
    }

    function playProceduralSfx(kind = "whoosh") {
      const mode = document.getElementById("sfxModeSelect").value;
      if (mode === "off") return;
      ensureAudioGraph();
      const now = audioCtx.currentTime;

      if (kind === "whoosh") {
        const bufferSize = audioCtx.sampleRate * 0.28;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(280, now);
        filter.frequency.exponentialRampToValueAtTime(1100, now + 0.25);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(destStreamNode);
        noise.start(now);
      } else if (kind === "impact") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.35);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(destStreamNode);
        osc.start(now);
        osc.stop(now + 0.37);
      } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.16);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(destStreamNode);
        osc.start(now);
        osc.stop(now + 0.19);
      }
    }

    function testSfx() {
      playProceduralSfx("whoosh");
      setTimeout(() => playProceduralSfx("impact"), 260);
    }

    function pickSceneType(sentence, index) {
      const s = sentence.toLowerCase();
      if (/brain|mind|cortex|think|memory|amygdala/.test(s)) return "brain_network";
      if (/crowd|alone|isolated|people|society|everyone/.test(s)) return "crowd_outlier";
      if (/time|clock|hour|midnight|3 am|future|morning/.test(s)) return "timeline_clock";
      if (/danger|alarm|stress|heart|fear|crisis|survival/.test(s)) return "heartbeat_meter";
      if (/vs|versus|compare|difference|half|while/.test(s)) return "split_compare";
      if (/grow|rise|up|loop|increase|multiply|level/.test(s)) return "rising_chart";
      return SCENE_TYPES[index % SCENE_TYPES.length].id;
    }

    function extractHeadline(sentence) {
      const words = sentence.replace(/[^a-zA-Z0-9\s]/g, "").trim().split(/\s+/);
      return words.slice(0, 4).join(" ").toUpperCase() || "KEY INSIGHT";
    }

    function rebuildStoryboard() {
      const script = document.getElementById("scriptInput").value.trim();
      const rawSentences = script.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || ["Your story begins here."];
      const cleaned = rawSentences.map(s => s.trim()).filter(Boolean);

      const dur = Number.isFinite(narrAudio.duration) && narrAudio.duration > 1
        ? narrAudio.duration
        : Math.max(12, cleaned.join(" ").split(/\s+/).length * 0.42);

      totalDuration = dur;
      const totalWords = cleaned.reduce((acc, s) => acc + s.split(/\s+/).length, 0) || 1;
      let cursor = 0;

      scenes = cleaned.map((text, idx) => {
        const w = text.split(/\s+/).length;
        const segDur = (w / totalWords) * totalDuration;
        const item = {
          idx,
          text,
          headline: extractHeadline(text),
          type: pickSceneType(text, idx),
          start: cursor,
          end: cursor + segDur
        };
        cursor += segDur;
        return item;
      });

      document.getElementById("totTime").textContent = formatTime(totalDuration);
      renderSceneList();
      drawFrame(currentTime);
    }

    function renderSceneList() {
      const wrap = document.getElementById("sceneList");
      wrap.innerHTML = scenes.map((sc, i) => `
        <div class="scene-item" id="scCard_${i}" onclick="jumpToScene(${i})">
          <div class="scene-head">
            <span>#${i + 1} (${formatTime(sc.start)} - ${formatTime(sc.end)})</span>
            <select onclick="event.stopPropagation()" onchange="changeSceneType(${i}, this.value)">
              ${SCENE_TYPES.map(t => `<option value="${t.id}" ${t.id === sc.type ? "selected" : ""}>${t.label}</option>`).join("")}
            </select>
          </div>
          <div class="scene-text">${sc.text}</div>
        </div>
      `).join("");
    }

    function changeSceneType(i, val) {
      if (scenes[i]) {
        scenes[i].type = val;
        drawFrame(currentTime);
      }
    }

    function jumpToScene(i) {
      if (!scenes[i]) return;
      currentTime = scenes[i].start + 0.05;
      if (narrAudio.src && Number.isFinite(narrAudio.duration)) {
        narrAudio.currentTime = Math.min(narrAudio.duration - 0.1, currentTime);
      }
      drawFrame(currentTime);
    }

    async function generateNeuralVoice() {
      const text = document.getElementById("scriptInput").value.trim();
      if (!text) return alert("Enter your script first.");
      const btn = document.getElementById("genVoiceBtn");
      const status = document.getElementById("statusMsg");

      btn.disabled = true;
      btn.textContent = "Generating Neural Voice...";
      status.textContent = "Synthesizing free neural narration on server...";

      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            voice: document.getElementById("voiceSelect").value,
            rate: document.getElementById("rateSelect").value
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "TTS request failed");
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        narrAudio.src = url;
        await new Promise((resolve) => {
          narrAudio.onloadedmetadata = resolve;
        });
        currentTime = 0;
        rebuildStoryboard();
        status.textContent = `Neural voice ready (${formatTime(narrAudio.duration)})! Tap Play Preview or Export 16:9 Video.`;
      } catch (e) {
        status.textContent = "Voice error: " + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Free Neural Voice";
      }
    }

    function loadUploadedAudio(file) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      narrAudio.src = url;
      narrAudio.onloadedmetadata = () => {
        currentTime = 0;
        rebuildStoryboard();
        document.getElementById("statusMsg").textContent = `Custom audio loaded (${formatTime(narrAudio.duration)}).`;
      };
    }
          function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
    }

    function seekScrubber(val) {
      const t = (Number(val) / 1000) * totalDuration;
      currentTime = t;
      if (narrAudio.src && Number.isFinite(narrAudio.duration)) {
        narrAudio.currentTime = Math.min(narrAudio.duration - 0.05, t);
      }
      drawFrame(currentTime);
    }

    function togglePlay() {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      ensureAudioGraph();
      if (!scenes.length) rebuildStoryboard();
      isPlaying = true;
      lastSceneIdx = -1;
      document.getElementById("playBtn").textContent = "Pause";
      startDrone();

      if (narrAudio.src) {
        narrAudio.currentTime = currentTime;
        narrAudio.play().catch(() => {});
      }
      lastRaf = performance.now();
      requestAnimationFrame(tick);
    }

    function stopPlayback() {
      isPlaying = false;
      document.getElementById("playBtn").textContent = "Play Preview";
      stopDrone();
      if (!narrAudio.paused) narrAudio.pause();
    }

    function tick(now) {
      if (!isPlaying) return;
      const dt = (now - lastRaf) / 1000;
      lastRaf = now;

      if (narrAudio.src && !narrAudio.paused && Number.isFinite(narrAudio.currentTime)) {
        currentTime = narrAudio.currentTime;
      } else {
        currentTime += dt;
      }

      if (currentTime >= totalDuration) {
        currentTime = 0;
        stopPlayback();
        drawFrame(0);
        return;
      }

      drawFrame(currentTime);
      requestAnimationFrame(tick);
    }

    function drawStickFigure(x, y, scale, phase, color, pose = "walk") {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";

      const bob = Math.abs(Math.sin(phase * 2)) * 6;
      ctx.beginPath();
      ctx.arc(0, -78 + bob, 16, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -62 + bob);
      ctx.lineTo(0, -18 + bob);
      ctx.stroke();

      const armSwing = pose === "think" ? 0.3 : Math.sin(phase) * 0.65;
      ctx.beginPath();
      ctx.moveTo(0, -52 + bob);
      ctx.lineTo(-22 * Math.cos(armSwing), -24 + bob + 16 * Math.sin(armSwing));
      ctx.moveTo(0, -52 + bob);
      if (pose === "think") {
        ctx.lineTo(18, -72 + bob);
      } else {
        ctx.lineTo(22 * Math.cos(armSwing), -24 + bob - 16 * Math.sin(armSwing));
      }
      ctx.stroke();

      const legSwing = Math.sin(phase) * 0.75;
      ctx.beginPath();
      ctx.moveTo(0, -18 + bob);
      ctx.lineTo(-20 * Math.sin(legSwing), 28);
      ctx.moveTo(0, -18 + bob);
      ctx.lineTo(20 * Math.sin(legSwing), 28);
      ctx.stroke();

      ctx.restore();
    }

    function wrapText(text, maxWidth) {
      const words = String(text || "").split(/\s+/);
      const lines = [];
      let line = "";
      for (const w of words) {
        const test = (line + " " + w).trim();
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines.slice(0, 2);
    }

    function drawFrame(t) {
      const theme = THEMES[document.getElementById("themeSelect").value] || THEMES.dark_ink;
      const W = canvas.width;
      const H = canvas.height;

      const idx = Math.max(0, scenes.findIndex(s => t >= s.start && t <= s.end));
      const sc = scenes[idx] || { idx: 0, text: "", headline: "CODED STUDIO", type: "stick_walk", start: 0, end: 1 };
      const localT = Math.max(0, t - sc.start);
      const progress = Math.min(1, localT / Math.max(0.1, sc.end - sc.start));

      if (isPlaying && idx !== lastSceneIdx) {
        lastSceneIdx = idx;
        playProceduralSfx(idx % 3 === 0 ? "impact" : "whoosh");
        document.querySelectorAll(".scene-item").forEach((el, k) => {
          el.classList.toggle("active", k === idx);
        });
      }

      document.getElementById("curTime").textContent = formatTime(t);
      document.getElementById("sceneBadge").textContent = `Scene ${idx + 1} / ${scenes.length || 1}`;
      document.getElementById("scrubber").value = Math.round((t / Math.max(0.1, totalDuration)) * 1000);

      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = theme.grid;
      ctx.lineWidth = 1;
      for (let gx = 0; gx < W; gx += 64) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
      }
      for (let gy = 0; gy < H; gy += 64) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
      }

      const grad = ctx.createRadialGradient(W * 0.5, H * 0.44, 40, W * 0.5, H * 0.44, 460);
      grad.addColorStop(0, theme.accent + "26");
      grad.addColorStop(1, "transparent");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = theme.sub;
      ctx.font = "600 20px system-ui";
      ctx.textAlign = "left";
      ctx.fillText(document.getElementById("topicInput").value.toUpperCase().slice(0, 48), 48, 52);

      ctx.fillStyle = theme.accent;
      ctx.font = "800 36px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(sc.headline, W / 2, 108);

      const cx = W / 2;
      const cy = H * 0.48;

      if (sc.type === "stick_walk") {
        ctx.strokeStyle = theme.sub;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(240, cy + 56); ctx.lineTo(W - 240, cy + 56); ctx.stroke();
        const walkX = cx - 120 + progress * 240;
        drawStickFigure(walkX, cy + 20, 1.35, t * 6, theme.ink, "walk");
      } else if (sc.type === "crowd_outlier") {
        for (let k = -3; k <= 3; k++) {
          if (k === 0) continue;
          drawStickFigure(cx + k * 115, cy + 25, 0.95, t * 2 + k, theme.sub, "walk");
        }
        drawStickFigure(cx, cy + 12, 1.45, t * 4, theme.accent, "think");
      } else if (sc.type === "brain_network") {
        const nodes = [
          [-160, -50], [-70, -110], [65, -105], [165, -40],
          [-120, 65], [0, 20], [130, 70]
        ];
        ctx.strokeStyle = theme.accent + "88";
        ctx.lineWidth = 3;
        for (let a = 0; a < nodes.length; a++) {
          for (let b = a + 1; b < nodes.length; b++) {
            if ((a + b) % 2 === 0) {
              ctx.beginPath();
              ctx.moveTo(cx + nodes[a][0], cy + nodes[a][1]);
              ctx.lineTo(cx + nodes[b][0], cy + nodes[b][1]);
              ctx.stroke();
            }
          }
        }
        nodes.forEach(([nx, ny], nIdx) => {
          const pulse = 10 + Math.sin(t * 6 + nIdx) * 4;
          ctx.fillStyle = nIdx % 2 === 0 ? theme.accent : theme.ink;
          ctx.beginPath();
          ctx.arc(cx + nx, cy + ny, pulse, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (sc.type === "rising_chart") {
        ctx.strokeStyle = theme.sub;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 240, cy + 90);
        ctx.lineTo(cx + 240, cy + 90);
        ctx.moveTo(cx - 240, cy + 90);
        ctx.lineTo(cx - 240, cy - 110);
        ctx.stroke();

        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 6;
        ctx.beginPath();
        const steps = 24;
        for (let s = 0; s <= steps * progress; s++) {
          const f = s / steps;
          const px = cx - 230 + f * 450;
          const py = cy + 80 - Math.pow(f, 1.7) * 175;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      } else if (sc.type === "timeline_clock") {
        ctx.strokeStyle = theme.ink;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cx, cy - 10, 110, 0, Math.PI * 2);
        ctx.stroke();

        const ang = t * 3.5;
        ctx.strokeStyle = theme.accent;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 10);
        ctx.lineTo(cx + Math.cos(ang) * 85, cy - 10 + Math.sin(ang) * 85);
        ctx.stroke();
      } else if (sc.type === "split_compare") {
        ctx.strokeStyle = theme.sub;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx, cy - 120); ctx.lineTo(cx, cy + 100); ctx.stroke();
        drawStickFigure(cx - 170, cy + 25, 1.2, t * 3, theme.sub, "walk");
        drawStickFigure(cx + 170, cy + 15, 1.35, t * 6, theme.accent, "think");
      } else {
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 5;
        ctx.beginPath();
        for (let x = -280; x <= 280; x += 8) {
          const wave = Math.sin((x + t * 260) * 0.04) * (Math.abs(x) < 70 ? 75 : 14);
          if (x === -280) ctx.moveTo(cx + x, cy + wave); else ctx.lineTo(cx + x, cy + wave);
        }
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(5, 7, 12, 0.84)";
      ctx.fillRect(110, H - 148, W - 220, 96);
      ctx.strokeStyle = theme.accent + "66";
      ctx.lineWidth = 2;
      ctx.strokeRect(110, H - 148, W - 220, 96);

      ctx.fillStyle = theme.ink;
      ctx.font = "600 28px system-ui";
      ctx.textAlign = "center";
      const lines = wrapText(sc.text, W - 270);
      lines.forEach((ln, li) => {
        ctx.fillText(ln, W / 2, H - 104 + li * 36);
      });

      ctx.fillStyle = theme.accent;
      ctx.fillRect(0, 0, W * (t / Math.max(0.1, totalDuration)), 8);
    }

    async function exportVideo() {
      if (!scenes.length) rebuildStoryboard();
      const btn = document.getElementById("exportBtn");
      const status = document.getElementById("statusMsg");
      const dlWrap = document.getElementById("downloadWrap");

      ensureAudioGraph();
      btn.disabled = true;
      dlWrap.innerHTML = "";
      status.textContent = "Recording 16:9 video with Neural Voice + SFX...";

      const canvasStream = canvas.captureStream(30);
      const mixedTracks = [
        ...canvasStream.getVideoTracks(),
        ...destStreamNode.stream.getAudioTracks()
      ];
      const combinedStream = new MediaStream(mixedTracks);

      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
        ? "video/webm;codecs=vp9,opus"
        : "video/webm";

      const recorder = new MediaRecorder(combinedStream, { mimeType: mime, videoBitsPerSecond: 3500000 });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        dlWrap.innerHTML = `<a class="dl" href="${url}" download="coded_animation_16x9.webm">Download 16:9 Animated Video (.webm)</a>`;
        status.textContent = "Export complete! Your 16:9 video includes voiceover + SFX + coded animation.";
        btn.disabled = false;
      };

      currentTime = 0;
      recorder.start(250);
      startPlayback();

      const watchEnd = setInterval(() => {
        if (!isPlaying) {
          clearInterval(watchEnd);
          if (recorder.state !== "inactive") recorder.stop();
        }
      }, 250);
    }

    rebuildStoryboard();
  </script>
