<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Shorts Template Studio (12 Templates)</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 14px; background: #0b0d12; color: #f8fafc; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 500px; background: #141821; border: 1px solid #252b38; border-radius: 16px; padding: 18px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin: 0 0 16px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin: 12px 0 5px; color: #cbd5e1; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #2c3444; background: #0b0d12; color: #fff; font-size: 0.92rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 11px;
      font-size: 0.96rem; font-weight: 700; cursor: pointer;
    }
    .btn-ai { background: #8b5cf6; color: #fff; }
    .btn-save { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; margin-top: 8px; padding: 10px; font-size: 0.86rem; }
    .btn-render { background: #22c55e; color: #052e16; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .box { margin-top: 14px; padding: 12px; border-radius: 12px; background: #0b0d12; border: 1px solid #252b38; }
    .bar-bg { height: 8px; background: #252b38; border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .bar-fill { height: 100%; width: 0%; background: #22c55e; transition: width 0.3s; }
    video { width: 100%; border-radius: 10px; margin-top: 10px; background: #000; }
    .clip-card { margin-top: 12px; padding-top: 10px; border-top: 1px solid #1e293b; }
    a.dl { display: block; text-align: center; margin-top: 8px; padding: 11px; background: #3b82f6; color: #fff; font-weight: 700; border-radius: 10px; text-decoration: none; }
    .hint { font-size: 0.76rem; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Viral Shorts Template Studio</h1>
    <p class="sub">12 viral templates + SFX + watermark trim + 5–10m auto-clipper</p>

    <label>1. Upload Raw Clips or 5–10 Min Video</label>
    <input type="file" id="clips" accept="video/*" multiple />
    <div class="hint">Upload short clips for 1 Short, or 1 long video to auto-extract multiple Shorts.</div>

    <div class="row">
      <div>
        <label>Long Video Auto-Clips</label>
        <select id="autoExtractCount">
          <option value="1">1 Short</option>
          <option value="2">2 Shorts</option>
          <option value="3" selected>3 Shorts</option>
          <option value="4">4 Shorts</option>
        </select>
      </div>
      <div>
        <label>Watermark Edge Trim</label>
        <select id="cropMarginPercent">
          <option value="0">0% (Keep Full Edges)</option>
          <option value="8">8% (Light Trim)</option>
          <option value="12" selected>12% (Corner Logo Trim)</option>
          <option value="18">18% (Heavy Edge Trim)</option>
        </select>
      </div>
    </div>

    <label>2. Video Niche / Hook Idea</label>
    <input id="niche" placeholder="e.g. Zero brain cell funny fail, Wait till the end..." />

    <button class="btn btn-ai" id="inventBtn" onclick="inventTemplate()">Pick / Invent Viral Template</button>

    <div class="box">
      <label style="margin-top:0;">12 Viral Templates + Saved Presets</label>
      <select id="savedSelect" onchange="loadSavedTemplate()"></select>

      <label>Layout Style</label>
      <select id="layout">
        <option value="banner_top_white">White Top Banner + Centered Clip</option>
        <option value="banner_dark_cinema">Dark Cinema Top/Bottom Banner</option>
        <option value="split_zoom_focus">Split Screen (Full Clip + Zoomed Action)</option>
        <option value="full_punch_cuts">Full Screen 9:16 + Dynamic Zoom Cuts</option>
      </select>

      <label>Top Hook Headline</label>
      <input id="topHookText" value="BRO HAD ZERO BRAIN CELLS" />

      <div class="row">
        <div>
          <label>Bottom Tag</label>
          <input id="bottomTagText" value="WAIT FOR THE END..." />
        </div>
        <div>
          <label>Cut Speed (Seconds)</label>
          <input id="cutDurationSec" type="number" step="0.1" min="1.2" max="4.5" value="1.9" />
        </div>
      </div>

      <button class="btn btn-save" onclick="saveCurrentTemplate()">Save Template Preset on Phone</button>
    </div>

    <button class="btn btn-render" id="renderBtn" onclick="renderShort()">Edit & Export Viral Short(s)</button>

    <div class="box" id="statusBox" style="display:none;">
      <div id="statusText" style="font-size:0.88rem; font-weight:600;">Starting...</div>
      <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
      <div id="resultArea"></div>
    </div>
  </div>

  <script>
    const FALLBACK_12 = [
      { templateName: "1. White Top Banner Meme Hook", layout: "banner_top_white", topHookText: "BRO HAD ZERO BRAIN CELLS", bottomTagText: "WAIT FOR THE END...", cutDurationSec: 1.9, contrastBoost: 1.08, saturationBoost: 1.15, beatSfx: ["whoosh", "impact", "pop", "riser"] },
      { templateName: "2. Dark Cinema Twist Reveal", layout: "banner_dark_cinema", topHookText: "NOBODY EXPECTED THIS ENDING", bottomTagText: "WATCH UNTIL THE LAST SECOND", cutDurationSec: 2.3, contrastBoost: 1.12, saturationBoost: 1.08, beatSfx: ["riser", "impact", "whoosh", "tick"] },
      { templateName: "3. Split-Screen Zoom Detective", layout: "split_zoom_focus", topHookText: "99% MISS WHAT HAPPENS HERE", bottomTagText: "ZOOMED IN ON THE ACTION", cutDurationSec: 2.1, contrastBoost: 1.07, saturationBoost: 1.14, beatSfx: ["tick", "riser", "impact", "pop"] },
      { templateName: "4. Full-Screen Rapid Punch Cuts", layout: "full_punch_cuts", topHookText: "NON-STOP CHAOS IN 20 SECONDS", bottomTagText: "BLINK AND YOU MISS IT", cutDurationSec: 1.4, contrastBoost: 1.1, saturationBoost: 1.2, beatSfx: ["pop", "whoosh", "impact", "pop"] },
      { templateName: "5. Curiosity Gap Question Card", layout: "banner_top_white", topHookText: "HOW DID THIS EVEN HAPPEN?!", bottomTagText: "EXPLAIN THIS LOGIC", cutDurationSec: 2.2, contrastBoost: 1.06, saturationBoost: 1.12, beatSfx: ["whoosh", "tick", "riser", "impact"] },
      { templateName: "6. Instant Regret Dark Frame", layout: "banner_dark_cinema", topHookText: "INSTANT REGRET IN 3... 2... 1...", bottomTagText: "IT WENT WRONG IMMEDIATELY", cutDurationSec: 1.8, contrastBoost: 1.14, saturationBoost: 1.1, beatSfx: ["tick", "tick", "riser", "impact"] },
      { templateName: "7. Double-Take Split Reaction", layout: "split_zoom_focus", topHookText: "LOOK AT THE BACKGROUND", bottomTagText: "REPLAY THAT RIGHT NOW", cutDurationSec: 2.0, contrastBoost: 1.08, saturationBoost: 1.16, beatSfx: ["pop", "riser", "impact", "whoosh"] },
      { templateName: "8. High-Stakes Tension Build", layout: "full_punch_cuts", topHookText: "ONE MISTAKE RUINS EVERYTHING", bottomTagText: "HOLD YOUR BREATH...", cutDurationSec: 2.4, contrastBoost: 1.12, saturationBoost: 1.06, beatSfx: ["riser", "tick", "riser", "impact"] },
      { templateName: "9. Deadpan Observation Banner", layout: "banner_top_white", topHookText: "CONFIDENCE WITH ZERO PREPARATION", bottomTagText: "BOLD STRATEGY", cutDurationSec: 2.1, contrastBoost: 1.05, saturationBoost: 1.12, beatSfx: ["pop", "whoosh", "pop", "impact"] },
      { templateName: "10. Late-Night Mystery Frame", layout: "banner_dark_cinema", topHookText: "SOMETHING IS OFF ABOUT THIS", bottomTagText: "SPOT THE DETAIL", cutDurationSec: 2.5, contrastBoost: 1.15, saturationBoost: 0.98, beatSfx: ["riser", "tick", "whoosh", "impact"] },
      { templateName: "11. Hyper-Cut Hype Montage", layout: "full_punch_cuts", topHookText: "BEST MOMENTS BACK TO BACK", bottomTagText: "PURE ENERGY", cutDurationSec: 1.3, contrastBoost: 1.12, saturationBoost: 1.22, beatSfx: ["whoosh", "pop", "impact", "whoosh"] },
      { templateName: "12. Plot Twist Split Frame", layout: "split_zoom_focus", topHookText: "THE PLOT TWIST NOBODY SAW", bottomTagText: "DID NOT SEE THAT COMING", cutDurationSec: 2.2, contrastBoost: 1.09, saturationBoost: 1.15, beatSfx: ["whoosh", "riser", "impact", "pop"] }
    ];

    function getCustomSaved() {
      const saved = JSON.parse(localStorage.getItem("viral_shorts_custom_presets") || "[]");
      return Array.isArray(saved) ? saved : [];
    }

    function getAllTemplates() {
      return [...getCustomSaved(), ...FALLBACK_12];
    }

    function refreshTemplateDropdown(selectIndex = 0) {
      const list = getAllTemplates();
      const sel = document.getElementById("savedSelect");
      sel.innerHTML = list.map((t, idx) => `<option value="${idx}">${t.templateName}</option>`).join("");
      sel.value = String(selectIndex);
      applyTemplateToForm(list[selectIndex]);
    }

    function applyTemplateToForm(t) {
      if (!t) return;
      document.getElementById("layout").value = t.layout || "banner_top_white";
      document.getElementById("topHookText").value = t.topHookText || "";
      document.getElementById("bottomTagText").value = t.bottomTagText || "";
      document.getElementById("cutDurationSec").value = t.cutDurationSec || 2.0;
    }

    function loadSavedTemplate() {
      const idx = parseInt(document.getElementById("savedSelect").value, 10) || 0;
      applyTemplateToForm(getAllTemplates()[idx]);
    }

    function readFormTemplate(nameOverride) {
      return {
        templateName: nameOverride || document.getElementById("topHookText").value.slice(0, 26) || "Custom Template",
        layout: document.getElementById("layout").value,
        topHookText: document.getElementById("topHookText").value,
        bottomTagText: document.getElementById("bottomTagText").value,
        cutDurationSec: parseFloat(document.getElementById("cutDurationSec").value) || 2.0,
        contrastBoost: 1.08,
        saturationBoost: 1.15,
        beatSfx: ["whoosh", "impact", "pop", "riser"]
      };
    }

    function saveCurrentTemplate() {
      const name = prompt("Name this template preset:", document.getElementById("topHookText").value.slice(0, 24));
      if (!name) return;
      const custom = getCustomSaved();
      custom.unshift(readFormTemplate(`★ ${name}`));
      localStorage.setItem("viral_shorts_custom_presets", JSON.stringify(custom));
      refreshTemplateDropdown(0);
    }

    async function inventTemplate() {
      const btn = document.getElementById("inventBtn");
      btn.disabled = true;
      btn.textContent = "Selecting / Designing Template...";
      try {
        const res = await fetch("/api/invent-template", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            niche: document.getElementById("niche").value,
            clipCount: document.getElementById("clips").files.length || 2
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to invent template");

        const custom = getCustomSaved();
        custom.unshift(data.template);
        localStorage.setItem("viral_shorts_custom_presets", JSON.stringify(custom));
        refreshTemplateDropdown(0);
      } catch (e) {
        alert("Template error: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Pick / Invent Viral Template";
      }
    }

    async function renderShort() {
      const files = document.getElementById("clips").files;
      if (!files.length) return alert("Select at least 1 video clip first.");

      const btn = document.getElementById("renderBtn");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const barFill = document.getElementById("barFill");
      const resultArea = document.getElementById("resultArea");

      btn.disabled = true;
      statusBox.style.display = "block";
      resultArea.innerHTML = "";
      barFill.style.width = "4%";
      statusText.textContent = "Uploading video(s)...";

      const form = new FormData();
      for (const f of files) form.append("clips", f);
      form.append("templateJson", JSON.stringify(readFormTemplate()));
      form.append("autoExtractCount", document.getElementById("autoExtractCount").value);
      form.append("cropMarginPercent", document.getElementById("cropMarginPercent").value);

      try {
        const res = await fetch("/api/render-short", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Upload failed");

        const poll = setInterval(async () => {
          const sRes = await fetch(`/api/status/${data.jobId}`);
          const job = await sRes.json();
          statusText.textContent = job.status;
          barFill.style.width = `${job.progress}%`;

          if (job.done) {
            clearInterval(poll);
            btn.disabled = false;
            const list = Array.isArray(job.outputs) && job.outputs.length
              ? job.outputs
              : [{ label: "Edited Short", url: job.downloadUrl }];

            resultArea.innerHTML = list.map((item, idx) => `
              <div class="${idx > 0 ? "clip-card" : ""}">
                <div style="font-weight:700; font-size:0.9rem; margin-top:6px;">${item.label}</div>
                <video controls playsinline src="${item.url}"></video>
                <a class="dl" href="${item.url}" download="${item.label.toLowerCase().replace(/[^a-z0-9]+/g, "_")}.mp4">Download ${item.label}</a>
              </div>
            `).join("");
          } else if (job.error) {
            clearInterval(poll);
            btn.disabled = false;
          }
        }, 2000);
      } catch (err) {
        statusText.textContent = "Error: " + err.message;
        btn.disabled = false;
      }
    }

    refreshTemplateDropdown(0);
  </script>
</body>
</html>
