<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9:16 Freeze-Frame Comedy Shorts Editor</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; background: #090b10; color: #f8fafc; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 540px; }
    .card { background: #121620; border: 1px solid #232938; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    h1 { font-size: 1.15rem; margin: 0 0 3px; }
    .sub { color: #94a3b8; font-size: 0.8rem; margin: 0 0 10px; }
    .stage-wrap {
      position: relative; width: 270px; max-width: 100%; aspect-ratio: 9 / 16;
      margin: 0 auto; background: #05070a; border-radius: 14px; overflow: hidden;
      border: 2px solid #2b3346; touch-action: manipulation;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .search-bar { display: flex; gap: 8px; margin-top: 6px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: #cbd5e1; margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid #2a3142;
      background: #090b10; color: #f8fafc; font-size: 0.88rem;
    }
    .btn {
      padding: 11px 10px; border: none; border-radius: 9px; font-weight: 700;
      font-size: 0.84rem; cursor: pointer; width: 100%;
    }
    .btn-sm { width: auto; padding: 9px 14px; white-space: nowrap; }
    .btn-primary { background: #f59e0b; color: #1c1002; }
    .btn-play { background: #22c55e; color: #052e16; }
    .btn-export { background: #3b82f6; color: #fff; }
    .btn-ghost { background: #1e2433; color: #e2e8f0; border: 1px solid #30394f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .scrubber { width: 100%; margin: 10px 0 2px; accent-color: #f59e0b; }
    .time-bar { display: flex; justify-content: space-between; font-size: 0.76rem; color: #94a3b8; }
    .status { font-size: 0.8rem; color: #38bdf8; margin-top: 8px; font-weight: 600; }
    .clip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; max-height: 220px; overflow-y: auto; }
    .clip-card { background: #0b0e15; border: 1px solid #242b3d; border-radius: 9px; padding: 6px; cursor: pointer; text-align: left; }
    .clip-card img { width: 100%; height: 74px; object-fit: cover; border-radius: 6px; display: block; background: #161b26; }
    .clip-meta { font-size: 0.72rem; color: #cbd5e1; margin-top: 5px; display: flex; justify-content: space-between; }
    a.dl { display: block; text-align: center; margin-top: 10px; padding: 11px; background: #22c55e; color: #052e16; font-weight: 800; border-radius: 9px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Freeze-Frame Comedy Editor</h1>
      <p class="sub">Music Bed + Freeze Zoom + Punchline + Full Export</p>

      <div class="stage-wrap" id="stageWrap" onclick="setFocusFromTap(event)">
        <canvas id="stage" width="1080" height="1920"></canvas>
      </div>

      <input type="range" id="scrubber" class="scrubber" min="0" max="1000" value="0" oninput="seekScrubber(this.value)" />
      <div class="time-bar">
        <span id="curTime">00:00</span>
        <span id="freezeBadge">Freeze @ 02.0s</span>
        <span id="totTime">00:08</span>
      </div>

      <div class="controls">
        <button class="btn btn-play" id="playBtn" onclick="togglePlay()">Play Short</button>
        <button class="btn btn-primary" onclick="setFreezeAtCurrent()">Set Freeze Here</button>
        <button class="btn btn-export" id="exportBtn" onclick="exportShort()">Export 9:16</button>
      </div>
      <div class="status" id="statusMsg">Load a clip, set your freeze spot, and export.</div>
      <div id="downloadWrap"></div>
    </div>

    <div class="card">
      <label style="margin-top:0;">Find Clips Inside App</label>
      <div class="search-bar">
        <input id="clipQueryInput" value="funny fail" placeholder="Search e.g. funny, cat, stunt..." />
        <button class="btn btn-primary btn-sm" id="searchClipsBtn" onclick="searchClips()">Search</button>
      </div>
      <div class="clip-grid" id="clipResults"></div>

      <label>Or Upload Funny Clip (MP4 / MOV / WEBM)</label>
      <input type="file" id="clipInput" accept="video/*" onchange="loadClipFile(this.files[0])" />

      <div class="row2">
        <div>
          <label>Top Hook Caption</label>
          <input id="hookInput" value="WAIT FOR THE INSTANT REGRET" oninput="drawFrame(currentTime)" />
        </div>
        <div>
          <label>Freeze Punchline</label>
          <input id="punchInput" value="THIS MAN..." oninput="drawFrame(currentTime)" />
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Music Bed Vibe</label>
          <select id="musicStyleSelect">
            <option value="sneaky_groove" selected>Sneaky Comedy Groove</option>
            <option value="dark_tension">Dark Suspense Pulse</option>
            <option value="off">No Music (SFX Only)</option>
          </select>
        </div>
        <div>
          <label>Freeze SFX Cue</label>
          <select id="sfxTypeSelect">
            <option value="scratch_bass" selected>Vinyl Scratch + Sub Bass</option>
            <option value="heartbeat">Heartbeat Tension</option>
            <option value="chime_drop">Record Drop + Chime</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Freeze Hold Duration</label>
          <select id="freezeHoldSelect" onchange="recalcDuration(); drawFrame(currentTime);">
            <option value="1.2">1.2s (Snappy)</option>
            <option value="1.5" selected>1.5s (Balanced)</option>
            <option value="2.0">2.0s (Dramatic)</option>
          </select>
        </div>
        <div>
          <label>Aftermath Speed</label>
          <select id="aftermathRateSelect">
            <option value="1.0" selected>1.0x (Normal Payoff)</option>
            <option value="0.65">0.65x (Slow-Mo Fail)</option>
          </select>
        </div>
      </div>

      <div class="row2" style="margin-top:10px;">
        <button class="btn btn-ghost" onclick="resetFocus()">Center Zoom Target</button>
        <button class="btn btn-ghost" onclick="playFreezeSfx()">Test Freeze SFX</button>
      </div>
    </div>
  </div>

  <video id="srcVideo" playsinline muted crossorigin="anonymous" style="display:none;"></video>
    <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const stageWrap = document.getElementById("stageWrap");
    const srcVideo = document.getElementById("srcVideo");

    let hasVideo = false;
    let clipDuration = 6.5;
    let freezePoint = 2.0;
    let totalDuration = 8.0;
    let currentTime = 0;
    let isPlaying = false;
    let lastRaf = 0;
    let freezeSfxPlayed = false;

    let focusX = 0.5;
    let focusY = 0.42;

    let audioCtx = null;
    let destStreamNode = null;
    let musicTimer = null;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destStreamNode = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function startMusicBed() {
      stopMusicBed();
      const style = document.getElementById("musicStyleSelect").value;
      if (style === "off") return;
      ensureAudio();

      // Sneaky staccato bass/marimba notes or dark suspense pulse
      const notes = style === "sneaky_groove"
        ? [146.83, 0, 174.61, 196.0, 220.0, 0, 174.61, 130.81]
        : [110.0, 110.0, 123.47, 110.0, 98.0, 98.0, 110.0, 82.41];

      let step = 0;
      musicTimer = setInterval(() => {
        if (!isPlaying || !audioCtx) return;
        const freq = notes[step % notes.length];
        step++;
        if (!freq) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = style === "sneaky_groove" ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.085, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(destStreamNode);
        osc.start(now);
        osc.stop(now + 0.23);
      }, 280);
    }

    function stopMusicBed() {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function playFreezeSfx() {
      ensureAudio();
      const kind = document.getElementById("sfxTypeSelect").value;
      const now = audioCtx.currentTime;

      if (kind === "scratch_bass") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.28);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(destStreamNode);
        osc.start(now);
        osc.stop(now + 0.31);

        const sub = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        sub.type = "sine";
        sub.frequency.setValueAtTime(125, now + 0.06);
        sub.frequency.exponentialRampToValueAtTime(36, now + 0.55);
        subGain.gain.setValueAtTime(0.32, now + 0.06);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);
        sub.connect(subGain);
        subGain.connect(audioCtx.destination);
        subGain.connect(destStreamNode);
        sub.start(now + 0.06);
        sub.stop(now + 0.6);
      } else if (kind === "heartbeat") {
        [0, 0.24].forEach((offset) => {
          const hb = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          hb.type = "sine";
          hb.frequency.setValueAtTime(92, now + offset);
          hb.frequency.exponentialRampToValueAtTime(42, now + offset + 0.16);
          g.gain.setValueAtTime(0.28, now + offset);
          g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.18);
          hb.connect(g);
          g.connect(audioCtx.destination);
          g.connect(destStreamNode);
          hb.start(now + offset);
          hb.stop(now + offset + 0.19);
        });
      } else {
        const chime = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        chime.type = "triangle";
        chime.frequency.setValueAtTime(880, now);
        chime.frequency.exponentialRampToValueAtTime(440, now + 0.25);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
        chime.connect(g);
        g.connect(audioCtx.destination);
        g.connect(destStreamNode);
        chime.start(now);
        chime.stop(now + 0.27);
      }
    }

    async function searchClips() {
      const q = document.getElementById("clipQueryInput").value.trim() || "funny";
      const btn = document.getElementById("searchClipsBtn");
      const grid = document.getElementById("clipResults");
      const status = document.getElementById("statusMsg");

      btn.disabled = true;
      btn.textContent = "...";
      status.textContent = `Searching clips for "${q}"...`;

      try {
        const res = await fetch(`/api/clips?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Clip search failed");

        if (!data.clips || !data.clips.length) {
          grid.innerHTML = `<div style="font-size:0.78rem; color:#94a3b8;">No clips found.</div>`;
          status.textContent = "No matching clips found.";
          return;
        }

        grid.innerHTML = data.clips.map((c) => `
          <div class="clip-card" onclick="selectRemoteClip('${encodeURIComponent(c.videoUrl)}', ${Number(c.duration) || 6})">
            <img src="${c.thumb}" alt="clip" />
            <div class="clip-meta">
              <span>${c.duration}s</span>
              <span>Tap to load</span>
            </div>
          </div>
        `).join("");
        status.textContent = `Found ${data.clips.length} clips. Tap any card to load.`;
      } catch (err) {
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Search";
      }
    }

    function selectRemoteClip(encodedUrl, dur) {
      attachVideoSource(decodeURIComponent(encodedUrl), dur, "Clip loaded. Tap preview to set zoom target.");
    }

    function loadClipFile(file) {
      if (!file) return;
      attachVideoSource(URL.createObjectURL(file), null, "Clip loaded. Tap preview to set zoom target.");
    }

    function attachVideoSource(url, fallbackDur, readyMsg) {
      stopPlay();
      srcVideo.src = url;
      srcVideo.onloadedmetadata = () => {
        hasVideo = true;
        clipDuration = Math.min(20, Math.max(2.5, srcVideo.duration || fallbackDur || 6.5));
        // Keep freeze well before the end so aftermath plays out cleanly
        freezePoint = Math.min(Math.max(0.8, clipDuration * 0.42), Math.max(1.0, clipDuration - 1.6));
        currentTime = 0;
        recalcDuration();
        drawFrame(0);
        document.getElementById("statusMsg").textContent = readyMsg;
      };
    }

    function recalcDuration() {
      const hold = parseFloat(document.getElementById("freezeHoldSelect").value) || 1.5;
      totalDuration = clipDuration + hold;
      document.getElementById("totTime").textContent = formatSec(totalDuration);
      document.getElementById("freezeBadge").textContent = `Freeze @ ${freezePoint.toFixed(1)}s`;
    }

    function setFocusFromTap(ev) {
      const rect = stageWrap.getBoundingClientRect();
      focusX = Math.min(0.85, Math.max(0.15, (ev.clientX - rect.left) / rect.width));
      focusY = Math.min(0.85, Math.max(0.15, (ev.clientY - rect.top) / rect.height));
      drawFrame(currentTime);
    }

    function resetFocus() {
      focusX = 0.5;
      focusY = 0.42;
      drawFrame(currentTime);
    }

    function setFreezeAtCurrent() {
      const hold = parseFloat(document.getElementById("freezeHoldSelect").value) || 1.5;
      freezePoint = Math.min(Math.max(0.5, currentTime), Math.max(0.8, totalDuration - hold - 0.8));
      recalcDuration();
      drawFrame(currentTime);
      document.getElementById("statusMsg").textContent = `Freeze set at ${freezePoint.toFixed(1)}s.`;
    }

    function formatSec(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
    }

    function seekScrubber(val) {
      currentTime = (Number(val) / 1000) * totalDuration;
      syncVideoToTimeline(currentTime);
      drawFrame(currentTime);
    }

    function syncVideoToTimeline(t) {
      if (!hasVideo) return;
      const hold = parseFloat(document.getElementById("freezeHoldSelect").value) || 1.5;
      const rate = parseFloat(document.getElementById("aftermathRateSelect").value) || 1.0;
      let targetVidTime = t;
      if (t >= freezePoint && t <= freezePoint + hold) {
        targetVidTime = freezePoint;
      } else if (t > freezePoint + hold) {
        targetVidTime = freezePoint + (t - (freezePoint + hold)) * rate;
      }
      srcVideo.playbackRate = t > freezePoint + hold ? rate : 1.0;
      if (Math.abs(srcVideo.currentTime - targetVidTime) > 0.12) {
        srcVideo.currentTime = Math.min(srcVideo.duration || targetVidTime, Math.max(0, targetVidTime));
      }
    }

    function togglePlay() {
      if (isPlaying) stopPlay();
      else startPlay();
    }

    function startPlay() {
      ensureAudio();
      isPlaying = true;
      freezeSfxPlayed = false;
      document.getElementById("playBtn").textContent = "Pause";
      startMusicBed();
      if (hasVideo) {
        syncVideoToTimeline(currentTime);
        srcVideo.play().catch(() => {});
      }
      lastRaf = performance.now();
      requestAnimationFrame(tick);
    }

    function stopPlay() {
      isPlaying = false;
      document.getElementById("playBtn").textContent = "Play Short";
      stopMusicBed();
      if (hasVideo && !srcVideo.paused) srcVideo.pause();
    }

    function tick(now) {
      if (!isPlaying) return;
      const dt = (now - lastRaf) / 1000;
      lastRaf = now;
      currentTime += dt;

      if (currentTime >= totalDuration) {
        currentTime = 0;
        stopPlay();
        syncVideoToTimeline(0);
        drawFrame(0);
        return;
      }

      const hold = parseFloat(document.getElementById("freezeHoldSelect").value) || 1.5;
      const inFreeze = currentTime >= freezePoint && currentTime <= freezePoint + hold;

      if (inFreeze) {
        if (!freezeSfxPlayed) {
          freezeSfxPlayed = true;
          playFreezeSfx();
        }
        if (hasVideo && !srcVideo.paused) srcVideo.pause();
      } else if (hasVideo && srcVideo.paused) {
        syncVideoToTimeline(currentTime);
        srcVideo.play().catch(() => {});
      }

      drawFrame(currentTime);
      requestAnimationFrame(tick);
    }

    function drawFrame(t) {
      const W = canvas.width;
      const H = canvas.height;
      const hold = parseFloat(document.getElementById("freezeHoldSelect").value) || 1.5;
      const inFreeze = t >= freezePoint && t <= freezePoint + hold;
      const postFreezeShake = t > freezePoint + hold && t < freezePoint + hold + 0.4;

      document.getElementById("curTime").textContent = formatSec(t);
      document.getElementById("scrubber").value = Math.round((t / Math.max(0.1, totalDuration)) * 1000);

      ctx.save();
      ctx.fillStyle = "#05070a";
      ctx.fillRect(0, 0, W, H);

      const zoom = inFreeze ? 1.52 : (1.03 + Math.sin(t * 1.4) * 0.02);
      const shakeX = postFreezeShake ? (Math.random() - 0.5) * 28 : 0;
      const shakeY = postFreezeShake ? (Math.random() - 0.5) * 28 : 0;

      const fx = focusX * W;
      const fy = focusY * H;

      ctx.translate(fx + shakeX, fy + shakeY);
      ctx.scale(zoom, zoom);
      ctx.translate(-fx, -fy);

      if (hasVideo && srcVideo.readyState >= 2) {
        const vw = srcVideo.videoWidth || 1080;
        const vh = srcVideo.videoHeight || 1920;
        const scale = Math.max(W / vw, H / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        ctx.filter = inFreeze ? "grayscale(100%) contrast(135%)" : "none";
        ctx.drawImage(srcVideo, (W - dw) / 2, (H - dh) / 2, dw, dh);
        ctx.filter = "none";
      } else {
        ctx.fillStyle = inFreeze ? "#18181b" : "#111622";
        ctx.fillRect(0, 0, W, H);
      }

      if (!isPlaying) {
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(fx, fy, 42, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      if (inFreeze) {
        const vig = ctx.createRadialGradient(fx, fy, 120, fx, fy, 950);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.78)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
      }

      const hook = document.getElementById("hookInput").value.trim().toUpperCase();
      if (hook) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
        ctx.fillRect(60, 150, W - 120, 110);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "900 44px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(hook.slice(0, 32), W / 2, 220);
      }

      if (inFreeze) {
        const punch = document.getElementById("punchInput").value.trim().toUpperCase();
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(70, H - 520, W - 140, 116);
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 42px system-ui";
        ctx.textAlign = "center";
        ctx.fillText((punch || "THIS MAN...").slice(0, 30), W / 2, H - 446);
      }
    }

    async function exportShort() {
      const btn = document.getElementById("exportBtn");
      const status = document.getElementById("statusMsg");
      const dlWrap = document.getElementById("downloadWrap");

      ensureAudio();
      stopPlay();
      btn.disabled = true;
      dlWrap.innerHTML = "";
      status.textContent = "Recording full 9:16 Short... keep screen on until done.";

      const vStream = canvas.captureStream(30);
      const tracks = [...vStream.getVideoTracks()];
      if (destStreamNode && destStreamNode.stream.getAudioTracks().length) {
        tracks.push(...destStreamNode.stream.getAudioTracks());
      }
      const stream = new MediaStream(tracks);
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
        ? "video/webm;codecs=vp9,opus"
        : "video/webm";

      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 3500000 });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        dlWrap.innerHTML = `<a class="dl" href="${url}" download="freeze_frame_short_9x16.webm">Download Full 9:16 Short (.webm)</a>`;
        status.textContent = `Export finished (${totalDuration.toFixed(1)}s). Tap Download above.`;
        btn.disabled = false;
      };

      currentTime = 0;
      freezeSfxPlayed = false;
      syncVideoToTimeline(0);
      drawFrame(0);

      recorder.start(250);
      isPlaying = true;
      document.getElementById("playBtn").textContent = "Pause";
      startMusicBed();
      if (hasVideo) srcVideo.play().catch(() => {});

      const exportStart = performance.now();
      const targetMs = totalDuration * 1000 + 350;
      lastRaf = exportStart;

      function recordTick(now) {
        const dt = (now - lastRaf) / 1000;
        lastRaf = now;
        currentTime = Math.min(totalDuration, currentTime + dt);

        const hold = parseFloat(document.getElementById("freezeHoldSelect").value) || 1.5;
        const inFreeze = currentTime >= freezePoint && currentTime <= freezePoint + hold;

        if (inFreeze) {
          if (!freezeSfxPlayed) {
            freezeSfxPlayed = true;
            playFreezeSfx();
          }
          if (hasVideo && !srcVideo.paused) srcVideo.pause();
        } else if (hasVideo && srcVideo.paused) {
          syncVideoToTimeline(currentTime);
          srcVideo.play().catch(() => {});
        }

        drawFrame(currentTime);

        if (performance.now() - exportStart < targetMs) {
          requestAnimationFrame(recordTick);
        } else {
          stopPlay();
          if (recorder.state !== "inactive") recorder.stop();
        }
      }

      requestAnimationFrame(recordTick);
    }

    recalcDuration();
    drawFrame(0);
  </script>
</body>
</html>
